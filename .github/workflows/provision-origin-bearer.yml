name: Provision Cookidoo origin bearer in SSM (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROVISION-COOKIDOO-ORIGIN-BEARER exactly
        required: true
        type: string

permissions: {}

jobs:
  provision:
    if: github.ref == 'refs/heads/master' && inputs.confirmation == 'PROVISION-COOKIDOO-ORIGIN-BEARER'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      ORIGIN_BEARER: ${{ secrets.COOKIDOO_ORIGIN_BEARER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate secret without printing it
        run: test "${#ORIGIN_BEARER}" -ge 32
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cookidoo-origin-secret
      - name: Write only the Cookidoo origin secret as SSM SecureString
        run: >-
          aws ssm put-parameter --region "$AWS_REGION"
          --name /cookidoo-mcp/origin-bearer --type SecureString
          --key-id alias/aws/ssm --overwrite --value "$ORIGIN_BEARER"
      - name: Confirm parameter metadata only
        run: aws ssm describe-parameters --region "$AWS_REGION" --parameter-filters Key=Name,Option=Equals,Values=/cookidoo-mcp/origin-bearer --query 'Parameters[0].[Name,Type]' --output text
