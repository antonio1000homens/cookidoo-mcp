name: Cookidoo MCP - tests and ZIP Lambda smoke

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - infrastructure/**
      - scripts/**
      - requirements-runtime.txt
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
      - .gitignore
      - README.md
  push:
    branches: [master]
    paths:
      - src/**
      - tests/**
      - infrastructure/**
      - scripts/**
      - requirements-runtime.txt
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 6f7c33b1d23f8257814fd790341bc84cd88785e0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fetch pinned upstream
        run: |
          git clone https://github.com/alexandrepa/mcp-cookidoo.git /tmp/cookidoo-upstream
          git -C /tmp/cookidoo-upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C /tmp/cookidoo-upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Install pinned upstream and test dependencies
        run: |
          cd /tmp/cookidoo-upstream
          uv sync --locked --no-dev
          uv pip install --python .venv/bin/python -r "$GITHUB_WORKSPACE/requirements-runtime.txt"
          uv pip install --python .venv/bin/python pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1
      - name: Unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:/tmp/cookidoo-upstream"
          /tmp/cookidoo-upstream/.venv/bin/python -m pytest -q tests
          /tmp/cookidoo-upstream/.venv/bin/python -m compileall -q src
      - name: Check deployment shell syntax
        run: bash -n scripts/bootstrap-aws.sh scripts/deploy-aws.sh
      - name: CloudFormation lint
        run: |
          uvx --from cfn-lint==1.53.3 cfn-lint infrastructure/cookidoo.yaml infrastructure/bootstrap-github.yaml

  zip-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build standalone Lambda ZIP without Docker or ECR
        run: bash scripts/build-zip.sh
      - name: Check Lambda deployment package
        run: |
          set -euo pipefail
          test -s dist/cookidoo-mcp.zip
          unzip -l dist/cookidoo-mcp.zip | grep -E 'src/lambda_handler.py|server.py|mangum/'
