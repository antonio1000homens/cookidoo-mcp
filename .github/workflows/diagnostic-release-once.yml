name: Controlled Cookidoo MCP Lambda release (approved marker)

# A reviewed unique marker triggers a one-time protected production release.
on:
  pull_request:
    paths:
      - src/auth.py
      - src/recipe_images.py
      - requirements-runtime.txt
      - tests/test_recipe_images.py
      - tests/test_lambda_handler.py
      - .github/workflows/diagnostic-release-once.yml
      - tests/test_diagnostic_release.py
  push:
    branches: [master]
    paths:
      - .github/cookidoo-mcp-transport-diagnostics-approved-2026-11-05.txt
      - .github/cookidoo-image-upload-release-reviewed-2026-11-05.txt

permissions: {}

concurrency:
  group: cookidoo-mcp-release
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@v6
      - name: Build reviewed Lambda ZIP without publishing
        run: |
          set -euo pipefail
          bash -n scripts/release-recipe-tools.sh scripts/validate-recipe-release-request.sh
          bash scripts/build-zip.sh
          test -s dist/cookidoo-mcp.zip
          unzip -l dist/cookidoo-mcp.zip | grep -q 'src/auth.py'
          unzip -l dist/cookidoo-mcp.zip | grep -q 'src/recipe_images.py'
          unzip -l dist/cookidoo-mcp.zip | grep -q 'PIL/Image.py'
      - name: Validate templates and security contract
        run: |
          set -euo pipefail
          uvx --from cfn-lint==1.53.3 cfn-lint infrastructure/cookidoo.yaml infrastructure/bootstrap-github.yaml
          python -m unittest discover -s tests -p test_diagnostic_release.py -v
      - name: Preserve reviewed ZIP between jobs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cookidoo-mcp-diagnostic-zip
          path: dist/cookidoo-mcp.zip
          retention-days: 1
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      CODE_BUCKET: ${{ vars.CODE_BUCKET }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Retrieve exact validated ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cookidoo-mcp-diagnostic-zip
          path: dist
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cookidoo-mcp-diagnostic-release
      - name: Verify current write state and package before changes
        run: |
          set -euo pipefail
          test -n "$CODE_BUCKET"
          test -n "$AWS_CLOUDFORMATION_ROLE_ARN"
          test -s dist/cookidoo-mcp.zip
          [[ "$GITHUB_REF" == 'refs/heads/master' ]]
          current="$(aws cloudformation describe-stacks --region "$AWS_REGION" \
            --stack-name cookidoo-mcp --query 'Stacks[0].Parameters' --output json)"
          enabled="$(jq -er '.[] | select(.ParameterKey == "EnableRecipeCreation") | .ParameterValue' <<<"$current")"
          [[ "$enabled" == 'true' ]] || { echo '::error::Expected existing recipe writes to be enabled; no code changes allowed'; exit 1; }
      - name: Temporarily disable recipe creation (fail closed on error)
        env:
          RELEASE_ACTION: disable-writes
          RELEASE_CONFIRMATION: DISABLE-COOKIDOO-RECIPE-CREATION
        run: bash scripts/release-recipe-tools.sh
      - name: Deploy diagnosed Lambda ZIP with writes disabled
        env:
          RELEASE_ACTION: deploy-disabled
          RELEASE_CONFIRMATION: DEPLOY-COOKIDOO-WRITES-DISABLED
        run: bash scripts/release-recipe-tools.sh
      - name: Restore previously enabled write gate on this exact reviewed build
        env:
          RELEASE_ACTION: enable-writes
          RELEASE_CONFIRMATION: ENABLE-COOKIDOO-RECIPE-CREATION
        run: bash scripts/release-recipe-tools.sh
      - name: Verify existing Function URL and exact build key
        run: |
          set -euo pipefail
          params="$(aws cloudformation describe-stacks --region "$AWS_REGION" \
            --stack-name cookidoo-mcp --query 'Stacks[0].Parameters' --output json)"
          key="$(jq -er '.[] | select(.ParameterKey == "CodeKey") | .ParameterValue' <<<"$params")"
          enabled="$(jq -er '.[] | select(.ParameterKey == "EnableRecipeCreation") | .ParameterValue' <<<"$params")"
          [[ "$key" == "cookidoo-mcp/$GITHUB_SHA/cookidoo-mcp.zip" ]]
          [[ "$enabled" == "true" ]]
          echo '### Cookidoo reviewed image support released' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing Function URL preserved by each release phase' >> "$GITHUB_STEP_SUMMARY"
          echo '- Recipe writes restored to previous enabled state after verified code update' >> "$GITHUB_STEP_SUMMARY"
          echo '- Image preview and approved upload tools are now present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing recipe pictures were NOT changed' >> "$GITHUB_STEP_SUMMARY"
