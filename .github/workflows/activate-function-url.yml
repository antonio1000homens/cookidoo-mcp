name: Activate Cookidoo Lambda Function URL (manual security gate)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE-COOKIDOO-FUNCTION-URL exactly
        required: true
        type: string

permissions: {}

jobs:
  activate:
    if: github.ref == 'refs/heads/master' && inputs.confirmation == 'ACTIVATE-COOKIDOO-FUNCTION-URL'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      CODE_BUCKET: ${{ vars.CODE_BUCKET }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@v6
      - name: Validate CloudFormation template before public URL activation
        run: uvx --from cfn-lint==1.53.3 cfn-lint infrastructure/cookidoo.yaml infrastructure/bootstrap-github.yaml
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cookidoo-function-url-activation
      - name: Require deployed private Lambda and configured SSM path
        run: |
          set -euo pipefail
          config="$(aws lambda get-function-configuration --function-name cookidoo-mcp --region "$AWS_REGION" \
            --query '[State,LastUpdateStatus,Environment.Variables.ORIGIN_BEARER_PARAM]' --output text)"
          [[ "$config" == $'Active\tSuccessful\t/cookidoo-mcp/origin-bearer' ]] || {
            echo 'Lambda is not Active with the expected SSM parameter path.' >&2
            exit 1
          }
          if url_state="$(aws lambda get-function-url-config --function-name cookidoo-mcp --region "$AWS_REGION" \
            --query '[FunctionUrl,AuthType]' --output text 2>&1)"; then
            echo 'Function URL already exists; inspect and stop.' >&2; exit 1
          elif [[ "$url_state" != *ResourceNotFoundException* ]]; then
            echo 'Could not determine Function URL state; refusing activation.' >&2
            exit 1
          fi
      - name: Activate AWS Function URL as a separate reviewed action
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name cookidoo-mcp --region "$AWS_REGION" --output json)"
          value() { jq -er --arg k "$1" '.Stacks[0].Parameters[] | select(.ParameterKey == $k) | .ParameterValue' <<<"$stack"; }
          aws cloudformation deploy --region "$AWS_REGION" --stack-name cookidoo-mcp \
            --template-file infrastructure/cookidoo.yaml \
            --role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset --parameter-overrides \
            "FunctionName=$(value FunctionName)" "CodeBucket=$(value CodeBucket)" "CodeKey=$(value CodeKey)" \
            "EmailParameterName=$(value EmailParameterName)" "PasswordParameterName=$(value PasswordParameterName)" \
            "OriginBearerParameterName=$(value OriginBearerParameterName)" \
            "CloudflareTeamDomain=$(value CloudflareTeamDomain)" "CloudflareAudience=$(value CloudflareAudience)" \
            EnableFunctionUrl=true
          url="$(aws lambda get-function-url-config --function-name cookidoo-mcp --region "$AWS_REGION" --query FunctionUrl --output text)"
          test -n "$url"
          status() { curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$@" "$url/health"; }
          test "$(status)" = 403
          test "$(status -H 'Authorization: Bearer not-the-origin-secret')" = 403
          test "$(status -H 'Cf-Access-Jwt-Assertion: invalid.jwt.value')" = 403
          echo 'AWS Function URL activated. Direct-origin requests without credentials, with bearer only, and with JWT only all returned 403. Worker forwarding remains disabled.' >> "$GITHUB_STEP_SUMMARY"
