AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC deployment roles for the Cookidoo MCP ZIP Lambda. No billable resources.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing GitHub Actions OIDC provider ARN from this AWS account.
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:oidc-provider/token[.]actions[.]githubusercontent[.]com$'
  CodeBucket:
    Type: String
    Default: aws2022-lambda-code
    Description: Existing S3 artifact bucket in this region, not created by this stack.
    MinLength: 3
  ApplicationStackName:
    Type: String
    Default: cookidoo-mcp
    AllowedValues: [cookidoo-mcp]

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cookidoo-mcp-cfn-service
      Description: CloudFormation may manage only the Cookidoo MCP application.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CookidooMcpStackOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyCookidooLambdaZip
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/cookidoo-mcp/*
              - Sid: ManageOnlyCookidooFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cookidoo-mcp
              # No lambda:CreateFunctionUrlConfig, AddPermission or InvokeFunctionUrl:
              # this deployment role cannot expose a public HTTP endpoint.
              - Sid: ManageOnlyCookidooExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cookidoo-mcp-execution
              - Sid: PassOnlyCookidooRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cookidoo-mcp-execution
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageOnlyCookidooLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogStreams
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cookidoo-mcp
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cookidoo-mcp:*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cookidoo-mcp-github-deploy
      Description: Manual production environment deployment from one immutable GitHub repository ID.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # Exact repository and owner IDs (rather than a wildcard over names).
                'token.actions.githubusercontent.com:sub': 'repo:antonio1000homens@36929120/cookidoo-mcp@1446019078:environment:production'
      Policies:
        - PolicyName: CookidooMcpDeployOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadOnlyCookidooZipReleases
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/cookidoo-mcp/*
              - Sid: ValidateArtifactBucketRegion
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}
              - Sid: ManageOnlyCookidooMcpStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationStackName}/*
              - Sid: ValidateCloudFormationTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: PassOnlyCookidooCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: VerifyOwnFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cookidoo-mcp

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationServiceRoleArn:
    Value: !GetAtt CloudFormationServiceRole.Arn
